name: is_tool
description: >-
  What an intersyntactic tool does when it is called: an is_tools_api
  definition answered by runs the airlock decides, and a call followed to
  what the model is told.
version: 0.1.0
repository: https://github.com/intersyntactic/tool

environment:
  sdk: ^3.13.0

dependencies:
  is_airlock_api: ^0.2.0
  is_effects: ^0.1.0
  is_tools_api: ^0.2.1

dev_dependencies:
  analyzer: ^14.7.0
  lints: ^6.1.0
  test: ^1.25.0
