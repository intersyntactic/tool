name: is_tool
description: >-
  What an intersyntactic tool does when it is called: a tool definition
  from is_tool_definition_vocabulary handled by actions the airlock
  decides, and a call run through to what the model is told.
version: 0.15.0
repository: https://github.com/intersyntactic/tool

environment:
  sdk: ^3.13.0

dependencies:
  is_airlock_api: ^0.26.0
  is_program_request_vocabulary: ^0.1.0
  is_tool_definition_vocabulary: ^0.8.0

dev_dependencies:
  analyzer: ^14.7.0
  is_file_request_vocabulary: ^0.1.0
  is_relative_path_vocabulary: ^0.1.0
  lints: ^6.1.0
  test: ^1.25.0
